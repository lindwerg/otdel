[toolchain]
# Pinned to the exact stable release this workspace was built and tested against, so a
# local checkout and CI agree byte for byte. A floating `stable` would silently change
# the compiler (and clippy's lint set, which CI runs with `-D warnings`) underneath us.
# Bump this and the `toolchain:` values in .github/workflows/ci.yml together.
# No nightly features are used anywhere in this workspace.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
