[package]
name = "otdel-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OTDEL background worker: document extraction (1B), product understanding (1C), bounded industry research (1D) and the check that publishes an immutable knowledge version (1E), plus session purge, job lease recovery, storage staging sweep and orphan reporting."

[dependencies]
otdel-core.workspace = true
otdel-db.workspace = true
otdel-extract.workspace = true
otdel-knowledge.workspace = true
otdel-llm.workspace = true
otdel-embed.workspace = true
otdel-publish.workspace = true
otdel-research.workspace = true
otdel-search.workspace = true
otdel-storage.workspace = true

chrono.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
otdel-extract = { workspace = true, features = ["fixtures"] }
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
