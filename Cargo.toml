[workspace]
resolver = "2"
members = [
    "crates/otdel-core",
    "crates/otdel-storage",
    "crates/otdel-db",
    "crates/otdel-extract",
    "crates/otdel-llm",
    "crates/otdel-knowledge",
    "crates/otdel-api",
    "crates/otdel-worker",
    "apps/api",
    "apps/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
otdel-core = { path = "crates/otdel-core" }
otdel-storage = { path = "crates/otdel-storage" }
otdel-db = { path = "crates/otdel-db" }
otdel-extract = { path = "crates/otdel-extract" }
otdel-llm = { path = "crates/otdel-llm" }
otdel-knowledge = { path = "crates/otdel-knowledge" }
otdel-api = { path = "crates/otdel-api" }
otdel-worker = { path = "crates/otdel-worker" }

anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "multipart",
    "query",
    "tokio",
    "tower-log",
] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http-body-util = "0.1"
# Pure-Rust PDF reading (phase 1B). Chosen because the text-layer half of extraction must
# be testable without any binary installed on the machine: the unit tests build PDFs in
# process and read them back in process. It re-exports `lopdf`, which is how the page
# inventory (media box, rotation, image XObjects) is read — using the re-export instead of
# a second direct dependency guarantees both halves speak about the same `Document` type.
pdf-extract = "0.12"
# HTTP client of the phase 1C model adapter. `rustls-tls` keeps TLS in Rust (no system
# OpenSSL); `default-features = false` drops the default TLS stack and the cookie/proxy
# machinery a server-to-server JSON call has no use for. The client is only ever
# constructed when a key *and* a model are configured — see `otdel_llm::build_provider`.
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev]
debug = 1
