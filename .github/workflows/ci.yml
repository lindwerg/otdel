name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default; jobs opt into more only if a future step needs it.
permissions:
  contents: read

jobs:
  repository-check:
    name: repository-check
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4, pinned to full commit SHA (not a mutable tag).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      # actions/setup-node v4, pinned to full commit SHA (not a mutable tag).
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # scripts/check.mjs's manifest-vs-CI enforcement gate deliberately and
      # unconditionally FAILS if Cargo.toml / package.json /
      # apps/web/package.json is present (no pattern-matching of workflow
      # text — too easy to fake). That is what keeps the notices below from
      # being hardcoded forever: see docs/development.md.
      - name: Repository hygiene check (make check)
        run: make check

      # --- Status: runtime test suites are pending, not silently skipped. ---
      # Each notice is conditional on the corresponding manifest actually
      # being absent, so this workflow stops claiming "pending" the moment a
      # manifest is added (at which point the enforcement gate above requires
      # a real job to exist here too).
      - name: Report pending Rust checks
        if: hashFiles('Cargo.toml') == ''
        run: echo "::notice title=Rust checks pending::No Cargo.toml found yet; cargo fmt/clippy/test will run once the Rust workspace is scaffolded (see docs/development.md)."

      - name: Report pending web checks
        if: hashFiles('package.json', 'apps/web/package.json') == ''
        run: echo "::notice title=Web checks pending::No package.json found yet; npm/pnpm lint/build/test will run once the web app is scaffolded (see docs/development.md)."

  # --- Conditional jobs, documented but inert until their manifests exist. ---
  # These are intentionally NOT wired up as real steps yet: adding a `run:`
  # step here today would either fail (missing manifest) or silently pass
  # without checking anything, which would be misleading. This is not just a
  # documentation convention: scripts/check.mjs's manifest-vs-CI enforcement
  # gate FAILS `make check` (and therefore this CI job) the moment
  # Cargo.toml / package.json / apps/web/package.json is added without a
  # matching real job below. The PR that adds such a manifest must add the
  # real job in the same PR, for example:
  #   - rust-check: actions/checkout -> dtolnay/rust-toolchain (pinned SHA) ->
  #       cargo fmt --check, cargo clippy --all-targets -- -D warnings,
  #       cargo test, gated on `if: hashFiles('Cargo.toml') != ''`.
  #   - web-check: actions/checkout -> actions/setup-node (pinned SHA) ->
  #       npm/pnpm ci, lint, build, test, gated on
  #       `if: hashFiles('package.json') != ''`.
