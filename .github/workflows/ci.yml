name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default; jobs opt into more only if a future step needs it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The exact stable release this workspace is developed and tested against. Kept
  # identical to `channel` in rust-toolchain.toml — bump both together. A floating
  # `stable` would change the compiler and clippy's lint set between runs, and CI treats
  # warnings as errors.
  RUST_VERSION: "1.98.1"

jobs:
  repository-check:
    name: repository-check
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4, pinned to full commit SHA (not a mutable tag).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      # actions/setup-node v4, pinned to full commit SHA (not a mutable tag).
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Repository hygiene check
        run: node scripts/check.mjs

  # Runs unconditionally: the Rust workspace exists. (A job-level `if:` could not use
  # `hashFiles` anyway — that function is not available in the `jobs.<id>.if` context,
  # and jobs are evaluated before any checkout has happened.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts)
  rust-check:
    name: rust-check (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain, pinned to a full commit SHA (not a mutable branch).
      # The version itself comes from RUST_VERSION above and matches rust-toolchain.toml.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable branch
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      # actions/cache v4, pinned to a full commit SHA.
      - name: Cache cargo registry and target directory
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The toolchain version is part of the key: build artifacts from another
          # compiler must not be restored into a pinned-toolchain build.
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Library unit tests need no database. The database-backed suites run in the
      # integration job below — they are never skipped silently.
      - name: Unit tests
        run: cargo test --workspace --lib

      - name: Build the binaries
        run: cargo build --workspace --bins

  rust-integration:
    name: rust-integration (database-backed API tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same family as the local pilot: PostgreSQL 17 with pgvector available.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: otdel_superuser
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: otdel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otdel_superuser -d otdel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable branch
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry and target directory
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-it-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-it-${{ env.RUST_VERSION }}-

      # The same two-role setup the local pilot uses: the tests verify that row-level
      # security really applies to the runtime role, which only works if the roles differ.
      - name: Create the database roles and the test database
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U otdel_superuser -d otdel -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE otdel_migrator LOGIN PASSWORD 'ci-migrator-password'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
          CREATE ROLE otdel_app LOGIN PASSWORD 'ci-app-password'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
          CREATE DATABASE otdel_test OWNER otdel_migrator;
          REVOKE ALL ON DATABASE otdel_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE otdel_test TO otdel_migrator, otdel_app;
          SQL
          psql -h 127.0.0.1 -U otdel_superuser -d otdel_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO otdel_migrator;
          SQL

      # The hash is produced by the binary itself rather than pasted in, so no
      # hand-written credential string lives in this file. The password is a throwaway
      # value for a database that exists for the length of this job.
      - name: Generate a throwaway owner password hash
        run: |
          set -euo pipefail
          hash="$(printf '%s' "ci-only-owner-password" | cargo run --quiet --bin otdel-api -- hash-password)"
          test -n "$hash"
          echo "OTDEL_OWNER_PASSWORD_HASH=$hash" >> "$GITHUB_ENV"

      - name: Apply migrations and provision the bureau
        env:
          OTDEL_DATABASE_URL: postgres://otdel_app:ci-app-password@127.0.0.1:5432/otdel_test
          OTDEL_DATABASE_ADMIN_URL: postgres://otdel_migrator:ci-migrator-password@127.0.0.1:5432/otdel_test
          OTDEL_BUREAU_SLUG: local
        run: |
          set -euo pipefail
          cargo run --bin otdel-api -- migrate
          cargo run --bin otdel-api -- bootstrap
          # Re-running must be a no-op (regression for the search_path/_sqlx_migrations bug).
          cargo run --bin otdel-api -- migrate

      # Phase 1E: enable pgvector so the hybrid half of the search suite really runs.
      #
      # This cannot be part of the roles step (the `otdel` schema does not exist until
      # migration 0001) and cannot be part of a migration (pgvector is not a `trusted`
      # extension and `otdel_migrator` is deliberately NOSUPERUSER). Migration 0006
      # therefore carries on without the vector column, and this step adds both the
      # extension and the column afterwards — the same thing `scripts/dev-extensions.sh`
      # does locally.
      #
      # Schema `otdel`, not `public`: 0001 grants `USAGE` on `public` to the migration
      # role only, so a `vector` type there is invisible to `otdel_app`.
      #
      # Without this step the suite still passes — the hybrid test skips itself with a
      # message — but that path would never be exercised in CI, which is the same as not
      # having it.
      - name: Enable pgvector for the phase 1E search tests
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U otdel_superuser -d otdel_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector SCHEMA otdel;
          DO $$
          DECLARE
              v_schema text;
          BEGIN
              SELECT n.nspname INTO v_schema
                FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace
               WHERE e.extname = 'vector';
              IF v_schema IS NULL THEN
                  RAISE EXCEPTION 'pgvector is not available in this image';
              END IF;
              IF EXISTS (
                  SELECT 1 FROM information_schema.columns
                   WHERE table_schema = 'otdel' AND table_name = 'version_chunks'
                     AND column_name = 'embedding'
              ) THEN
                  RETURN;
              END IF;
              EXECUTE format('ALTER TABLE otdel.version_chunks ADD COLUMN embedding %I.vector',
                             v_schema);
              EXECUTE format(
                  'ALTER TABLE otdel.version_chunks ADD CONSTRAINT '
                  'version_chunks_embedding_matches_dims '
                  'CHECK (embedding IS NULL OR (embedding_dims IS NOT NULL '
                  'AND %I.vector_dims(embedding) = embedding_dims))', v_schema);
          END
          $$;
          SQL

      - name: Integration tests
        env:
          OTDEL_TEST_DATABASE_URL: postgres://otdel_app:ci-app-password@127.0.0.1:5432/otdel_test
          OTDEL_TEST_ADMIN_DATABASE_URL: postgres://otdel_migrator:ci-migrator-password@127.0.0.1:5432/otdel_test
          OTDEL_TEST_SUPERUSER_URL: postgres://otdel_superuser:ci-superuser-password@127.0.0.1:5432/otdel_test
        # The whole workspace, including the suites that need PostgreSQL. If the database
        # were missing these tests fail loudly rather than reporting success.
        run: cargo test --workspace

  # --- Web checks remain pending until the web app exists. ---
  # The frontend worker owns .github/workflows/web.yml and apps/web; this workflow does
  # not pretend to run web tests that do not exist here.
  web-status:
    name: web-status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Report pending web checks
        if: hashFiles('package.json', 'apps/web/package.json') == ''
        run: echo "::notice title=Web checks pending::No package.json found yet; the web workflow is added together with apps/web (see docs/development.md)."
