[package]
name = "otdel-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP API of OTDEL block 1: sessions, partners, material intake, page evidence (1B), the product knowledge draft (1C), bounded industry research (1D) and the published knowledge version with its search and answers (1E)."

[dependencies]
otdel-core.workspace = true
otdel-db.workspace = true
otdel-knowledge.workspace = true
otdel-embed.workspace = true
otdel-llm.workspace = true
otdel-publish.workspace = true
otdel-research.workspace = true
otdel-search.workspace = true
otdel-storage.workspace = true

axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The phase 1B suites drive the real worker against the real database through the real
# HTTP API, so they need both halves plus the in-memory PDF fixtures.
otdel-extract = { workspace = true, features = ["fixtures"] }
# The 1C suites drive the product role end to end with a scripted provider: no key,
# no network, and the same validation and storage path as a real run.
otdel-llm = { workspace = true, features = ["fake"] }
# The 1D suites do the same for the researcher: a scripted search endpoint and a scripted
# fetcher, so the budget, the source journal and the citation checks run for real while
# nothing leaves the machine and nothing is paid for.
otdel-search = { workspace = true, features = ["fake"] }
# The 1E suites drive the hybrid search with scripted vectors, so the vector half runs
# against a real pgvector column without a key and without a network.
otdel-embed = { workspace = true, features = ["fake"] }
otdel-worker.workspace = true

async-trait.workspace = true
http-body-util.workspace = true
sqlx.workspace = true
tower.workspace = true
